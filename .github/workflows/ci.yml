name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests examples scripts benchmarks plugins
      - name: Pyright
        run: python -m pyright src
      - name: Release metadata and documentation links
        run: |
          python scripts/check_release.py
          python scripts/check_codex_plugin.py
      - name: Coverage gate
        run: python -m pytest --cov=toolpermit --cov-report=term --cov-fail-under=70 -q
      - name: Policy benchmark smoke test
        run: python benchmarks/benchmark_policy.py --iterations 100 --trials 1

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install uv==0.12.3
      - name: Build
        run: uv build
      - name: Clean-install wheel smoke test
        shell: bash
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install dist/*.whl
          smoke-venv/bin/toolpermit --version
          smoke-venv/bin/python -c "from importlib.resources import files; assert files('toolpermit.web.static').joinpath('index.html').read_text()"
