name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release tooling
        run: >-
          python -m pip install -e ".[dev]" build "packaging>=26"
          "pip-audit>=2.9,<3"
      - name: Validate tag and package version
        shell: python {0}
        run: |
          import os
          import tomllib
          from pathlib import Path
          tag = os.environ["GITHUB_REF_NAME"]
          with Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match version {version!r}")
      - name: Verify source
        run: |
          python -m ruff check src tests examples scripts benchmarks plugins
          python -m pyright src
          python scripts/check_release.py
          python scripts/check_codex_plugin.py
          python -m pytest --cov=toolpermit --cov-fail-under=70 -q
          python -m pip_audit --local --skip-editable
      - name: Build once
        run: python -m build
      - name: Check distributions
        run: python scripts/check_distributions.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/toolpermit/
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/
      - name: Attest GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Create GitHub release from the same files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
