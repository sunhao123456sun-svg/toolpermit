name: Phase 1 spikes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase1-spikes.yml"
      - "spikes/phase1/**"
  pull_request:
    paths:
      - ".github/workflows/phase1-spikes.yml"
      - "spikes/phase1/**"

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: spikes/phase1/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spikes/phase1/node/package-lock.json

      - name: Install Python spike dependencies
        run: python -m pip install -r spikes/phase1/requirements.txt

      - name: Run Python spikes
        run: |
          python -m ruff check spikes/phase1 --exclude spikes/phase1/ui_package/dist
          python -m pytest -q spikes/phase1/tests

      - name: Install TypeScript client
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: spikes/phase1/node

      - name: Test independent TypeScript client through proxy
        run: >-
          node spikes/phase1/node/client.mjs
          python
          spikes/phase1/proxy.py
          spikes/phase1/fixture_server.py

      - name: Build UI asset packaging spike
        run: uv build
        working-directory: spikes/phase1/ui_package

      - name: Verify UI asset in built wheel
        shell: python {0}
        run: |
          import glob
          import subprocess
          import sys
          wheel = glob.glob("spikes/phase1/ui_package/dist/*.whl")
          assert len(wheel) == 1, wheel
          subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", wheel[0]], check=True)
          from toolpermit_ui_spike import index_html
          assert "toolpermit-ui-asset-ok" in index_html()
