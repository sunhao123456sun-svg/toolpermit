name: Dependency security audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and auditor
        run: python -m pip install -e ".[dev]" "pip-audit>=2.9,<3"
      - name: Audit installed dependency graph
        run: python -m pip_audit --local --skip-editable
