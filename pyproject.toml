[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolpermit"
version = "0.1.0"
description = "Local-first permission policies, approvals, and redacted audit for MCP tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ToolPermit contributors" }]
keywords = ["AI agents", "MCP", "permissions", "policy", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "mcp==2.0.0",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130,<7",
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<8",
  "pyright>=1.1.400,<2",
  "ruff==0.16.2",
]

[project.scripts]
toolpermit = "toolpermit.cli:app"

[project.urls]
Homepage = "https://github.com/sunhao123456sun-svg/toolpermit"
Repository = "https://github.com/sunhao123456sun-svg/toolpermit"
Issues = "https://github.com/sunhao123456sun-svg/toolpermit/issues"
Documentation = "https://github.com/sunhao123456sun-svg/toolpermit/tree/main/docs"
Changelog = "https://github.com/sunhao123456sun-svg/toolpermit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/toolpermit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SUPPORT.md",
  "/ROADMAP.md",
  "/docs",
  "/examples",
  "/benchmarks",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
